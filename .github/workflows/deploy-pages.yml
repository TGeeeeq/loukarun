name: Deploy to GitHub Pages

# Zrcadlí obsah hlavní větve do gh-pages,
# ze které GitHub Pages web servíruje.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push to gh-pages
        run: git push origin HEAD:gh-pages --force
