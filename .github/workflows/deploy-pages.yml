name: Deploy to GitHub Pages

# Nasazuje obsah hlavní větve přímo na GitHub Pages přes oficiální
# akce (zdroj Pages = „GitHub Actions"). Žádné zrcadlení do gh-pages –
# jeden krok, bez souběhu a bez závislosti na starém „branch" buildu.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nepřerušovat rozdělané nasazení – jinak může prostředí github-pages
# zůstat ve špatném stavu a další deploy skončí „Deployment failed".
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        # enablement: true přepne zdroj Pages na „GitHub Actions"
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
