<!doctype html><html><head><meta charset="utf-8">
<style>body{margin:0;background:#f7f2e7;font:12px system-ui}canvas{display:block;image-rendering:auto}
.w{display:flex;flex-wrap:wrap;gap:10px;padding:12px}
.c{background:#fff;border:1px solid #ddd;border-radius:8px;padding:8px;text-align:center}</style>
</head><body><div class="w" id="w"></div>
<script src="/js/data.js"></script><script src="/js/gfx.js"></script>
<script>
const chs = DATA.CHARACTERS;
const box = document.getElementById('w');
for (const ch of chs) {
  const d = document.createElement('div'); d.className = 'c';
  const cv = document.createElement('canvas'); cv.width = 380; cv.height = 330;
  const x = cv.getContext('2d'); x.scale(2, 2);
  GFX.drawCharacter(x, ch, 95, 145, 1.15, { runPhase: 0 }, 400);
  d.appendChild(cv);
  const l = document.createElement('div'); l.textContent = ch.id; d.appendChild(l);
  box.appendChild(d);
}
document.title = 'ok:' + chs.length;
</script></body></html>
